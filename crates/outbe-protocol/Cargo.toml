[package]
name        = "outbe-protocol"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
description = "BN254, Grumpkin, Poseidon2, and Schnorr primitives for the Outbe protocol."
readme      = "README.md"
keywords    = ["outbe", "poseidon", "bn254", "zero-knowledge", "consensus"]
categories  = ["cryptography"]

[features]
# Field-encoding impls for alloy ABI scalar types (address / uint256 /
# bytes32), so consumers can use bare alloy types in entity structs. The
# impls must live here, next to the trait (orphan rule).
alloy = ["dep:alloy-primitives"]

[dependencies]
ark-bn254     = { workspace = true, features = ["curve", "asm"] }
ark-grumpkin  = { workspace = true, features = ["asm"] }
ark-ff        = { workspace = true, features = ["asm"] }
ark-ec        = { workspace = true }
ark-std       = { workspace = true }
ark-serialize = { workspace = true }
outbe-poseidon  = { workspace = true }
blake2        = { workspace = true }
alloy-primitives = { workspace = true, optional = true }
thiserror     = { workspace = true }
zeroize        = { workspace = true }

# ark-ec's parallel MSM creates native thread pools; ordinary browser WASM
# cannot spawn them. Keep native behavior unchanged and use serial wasm math.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ark-ff = { workspace = true, features = ["parallel"] }
ark-ec = { workspace = true, features = ["parallel"] }
ark-std = { workspace = true, features = ["parallel"] }

[dev-dependencies]
ark-std = { workspace = true, features = ["parallel"] }
alloy-primitives = { workspace = true}
# The companion derive macro — exercised by the entity-hash set-encoding tests
# (`tests/sorted_set.rs`). A dev-dep keeps the published crate dependency-free
# while letting the tests drive `#[derive(Entity)]` end-to-end.
outbe-protocol-derive = { path = "../outbe-protocol-derive", version = "0.26.0" }
