[package]
name = "ownership-rd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
ark-groth16.workspace = true
ark-relations.workspace = true
ark-r1cs-std.workspace = true
ark-crypto-primitives.workspace = true
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-grumpkin = { workspace = true, features = ["r1cs"] }
ark-std = { workspace = true, features = ["std", "getrandom"] }
outbe-poseidon.workspace = true
outbe-protocol.workspace = true
outbe-zk-canonical = { path = "../../crates/outbe-zk-canonical" }
nova-snark.workspace = true
ff.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
web-time.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ark-groth16 = { workspace = true, features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }
